<!-- Login Page -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EduTrack Student Portal Dashboard">
    <meta name="author" content="Imeer Hafiz Isyraf">
    <meta name="keywords" content="student, dashboard, assignments, grades">
    <title>EduTrack</title>
    <!-- Tab Icon -->
    <link rel="icon" type="image/svg" href="mortarboard-fill.svg">
    <!-- Bootsrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootsrap Icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body id="varta-bg">
<div class="d-flex justify-content-center align-items-center vh-100">
        
    <div class="login-container">
        <div class="login-card">

            <!-- Logo -->
            <div class=" d-flex flex-column justify-content-center align-items-center text-white text-center">

                <div class="logo-icon mb-3">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>

                <h2 class="fw-bold mb-2">EduTrack</h2>

                <br/>

                <p class="fw-bold mb-0 large">
                    Smart Student Management System
                </p>

            </div>

            <br/>

            <h1 class="login-title">Login</h1>
            
            <!-- Username Text Box -->
            <div class="mb-4 position-relative">
                <label>Email</label>
                <i class="bi bi-envelope-fill input-icon"></i>
                <input type="email" class="form-control custom-input" placeholder="Enter Username" name="uname" required>
            </div>

            <!-- Login Text Box -->
            <div class="mb-3 position-relative">
                <label>Password</label>
                <i class="bi bi-lock-fill input-icon"></i>
                <input type="password" class="form-control custom-input" placeholder="Enter Password" name="psw" required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 small-text">
                <!-- Remember Me Check Box -->
                <div>
                    <input type="checkbox">
                    Remember me
                </div>
                <!-- Forgot Password -->
                <a href="#">Forgot Password?</a>
            </div>

            <!-- Login Button -->
            <button class="btn login-btn w-100" onclick="login()">Login</button>
            <div id="error-msg" class="text-danger text-center mt-3" style="display:none;">
                Incorrect email or password. Please recheck your input.
            </div>

            <!-- Register Button -->
            <p class="register-text mt-4">
                Don't have an account?
                <a href="#">Register</a>
            </p>

        </div>
    </div>

</div>
    <!-- Bootsrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Vanta Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
    <script>
    VANTA.GLOBE({
    el: "#varta-bg",
    mouseControls: true,
    touchControls: true,
    gyroControls: false,
    minHeight: 200.00,
    minWidth: 200.00,
    scale: 1.00,
    scaleMobile: 1.00
    })
    </script>
    <!-- Login Function-->
    <script>
    function login() {
        // hardcoded credentials
        const validEmail = "imeerhafiz@edutrack.edu.my";
        const validPassword = "123456";

        // get user input
        const email = document.querySelector('input[name="uname"]').value;
        const password = document.querySelector('input[name="psw"]').value;

        const errorMsg = document.getElementById("error-msg");

        // check credentials
        if (email === validEmail && password === validPassword) {
            errorMsg.style.display = "none";
            // redirect if needed
            window.location.href = "dashboard.html";
        } else {
            errorMsg.style.display = "block";
        }
    }
    </script>
</body>
</html>
